<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Pagina de Jogos</title>
    <link rel="stylesheet" type="text/css" href="cadastro.css" href="../aulaex.html">
</head>
<body>

    <header class="Topo">
        <h1 class="topo_cadastro">Cadastre-se Aqui</h1>
    </header>

    <form action="https://formsubmit.co/kakamartinsdonascimento@gmail.com" method="post">
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="+55 (11) 99999-9999">
        </div>

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" minlength="8" maxlength="20" required>
        </div>

        <div class="form-group">
            <label for="data_nascimento">Data de Nascimento</label>
            <input type="date" id="data_nascimento" name="nascimento">
        </div>

        <div class="form-group">
            <p>Gênero</p>
            <div class="radio-group">
                <input type="radio" id="masculino" name="genero" value="masculino">
                <label for="masculino">Masculino</label>

                <input type="radio" id="feminino" name="genero" value="feminino">
                <label for="feminino">Feminino</label>

                <input type="radio" id="agenero" name="genero" value="agenero">
                <label for="agenero">Agênero</label>
            </div>
        </div>

        <div class="form-group">
            <label for="estado">Estado</label>
            <select id="estado" name="estado" required>
                <option value="" disabled selected>Selecione seu estado</option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
            </select>
        </div>

        <div class="form-group">
            <label>Plataformas que você possui</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="plataforma" value="pc"> PC</label>
                <label><input type="checkbox" name="plataforma" value="ps5"> PlayStation 5</label>
                <label><input type="checkbox" name="plataforma" value="xbox"> Xbox Series</label>
                <label><input type="checkbox" name="plataforma" value="switch"> Nintendo Switch</label>
                <label><input type="checkbox" name="plataforma" value="mobile"> Mobile</label>
            </div>
        </div>

        <div class="form-group">
            <button type="submit">Enviar Cadastro</button>
        </div>

    </form>

    <footer class="rodape">
        <div class="rodape_logo">
            <img src="Gemini_Generated_Image_odzn5dodzn5dodzn.png" alt="Logo Technical Games">
        </div>

        <div class="rodape_info">
            <p>Encontrou um erro? Selecione-o e pressione Ctrl + Enter.</p>
            <p>Jogos testados pelo <strong>notebookcheck.net</strong></p>
        </div>

        <div class="rodape_links">
            <a href="#">Sobre nós</a>
            <a href="#">Contato</a>
            <a href="#">Política de privacidade</a>
            <a href="#">Termos de Uso</a>
        </div>

        <div class="rodape_links2">
            <a href="#">Twitter</a>
            <a href="#">Instagram</a>
            <a href="#">Discord</a>
            <a href="#">TikTok</a>
        </div>
    </footer>

</body>
</html
